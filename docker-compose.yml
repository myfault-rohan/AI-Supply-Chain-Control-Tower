version: '3.8'

services:
  # ============================================================================
  # FastAPI Backend
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: supply-chain-backend
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - DATABASE_URL=sqlite:////app/data/app.db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET}
      - API_URL=http://backend:8000
      - DATASET_DIR=/app/data
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
      - ./config.py:/app/config.py
    depends_on:
      - redis
    command: uvicorn backend.api_server_phase1:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - supply-chain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================================
  # Streamlit Dashboard
  # ============================================================================
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: supply-chain-dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
    volumes:
      - ./dashboard:/app/dashboard
      - ./config.py:/app/config.py
    depends_on:
      - backend
    networks:
      - supply-chain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # Redis Cache Layer
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: supply-chain-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - supply-chain-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # PostgreSQL (Optional for Phase 2+)
  # Uncomment to use PostgreSQL instead of SQLite
  # ============================================================================
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: supply-chain-postgres
  #   environment:
  #     POSTGRES_USER: supply_chain
  #     POSTGRES_PASSWORD: ${DB_PASSWORD}
  #     POSTGRES_DB: supply_chain_db
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - supply-chain-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U supply_chain"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

# ============================================================================
# Networks
# ============================================================================
networks:
  supply-chain-network:
    driver: bridge

# ============================================================================
# Volumes
# ============================================================================
volumes:
  redis-data:
  # postgres-data:
