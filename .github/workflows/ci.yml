name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: "ci-test-only-insecure-secret-do-not-use-in-production"
      API_URL: "http://127.0.0.1:8000"
      DATASET_DIR: "dataset"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "fastapi==0.104.1" \
            "uvicorn==0.24.0" \
            "pydantic==2.5.0" \
            "pydantic-settings==2.1.0" \
            "python-multipart==0.0.6" \
            "sqlalchemy==2.0.23" \
            "bcrypt==4.1.1" \
            "passlib[bcrypt]==1.7.4" \
            "python-jose[cryptography]==3.3.0" \
            "slowapi==0.1.9" \
            "fastapi-cache2[redis]==0.2.2" \
            "redis==4.5.5" \
            "celery==5.3.6" \
            "pandas==2.1.3" \
            "numpy==1.26.2" \
            "scikit-learn==1.3.2" \
            "xgboost==2.0.3" \
            "httpx==0.25.1" \
            "requests==2.31.0" \
            "python-dotenv==1.0.0" \
            "reportlab==4.0.7" \
            "pytest==7.4.3" \
            "pytest-asyncio==0.21.1"

      - name: Run tests
        run: |
          python -m pytest tests/test_api.py tests/test_auth.py tests/test_ml.py -v --tb=short
